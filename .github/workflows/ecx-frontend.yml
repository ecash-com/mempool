# Builds the ECX frontend image and pushes it to GHCR. Kept separate from
# upstream's docker.yml so rebases never conflict here. Frontend only. The
# stack runs the upstream backend image.
name: ECX frontend

on:
  push:
    branches: [ecx]
    tags: ['ecx-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  units:
    name: Check ECX unit labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Bitcoin unit labels in rendered code paths
        run: ./frontend/check-ecx-units.sh

  image:
    name: Build and push frontend
    runs-on: ubuntu-latest
    needs: units
    steps:
      - uses: actions/checkout@v4

      - name: Add SHORT_SHA env property
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"

      - name: Init repo for Dockerization
        run: docker/init.sh "$SHORT_SHA"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          build-args: commitHash=${{ env.SHORT_SHA }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mempool-frontend:sha-${{ env.SHORT_SHA }}
            ghcr.io/${{ github.repository_owner }}/mempool-frontend:alphanet

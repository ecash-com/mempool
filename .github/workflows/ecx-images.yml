# Builds the ECX frontend and backend images and pushes them to GHCR. Kept
# separate from upstream's docker.yml so rebases never conflict here.
name: ECX images

on:
  push:
    branches: [master]
    tags: ['ecx-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  units:
    name: Check ECX unit labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Bitcoin unit labels in rendered code paths
        run: ./frontend/check-ecx-units.sh

  image:
    name: Build and push frontend
    runs-on: ubuntu-latest
    needs: units
    steps:
      - uses: actions/checkout@v4

      - name: Add SHORT_SHA env property
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"

      - name: Init repo for Dockerization
        run: docker/init.sh "$SHORT_SHA"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          build-args: commitHash=${{ env.SHORT_SHA }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mempool-frontend:sha-${{ env.SHORT_SHA }}
            ghcr.io/${{ github.repository_owner }}/mempool-frontend:latest

  backend:
    name: Build and push backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add SHORT_SHA env property
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"

      # Copies docker/backend/* (Dockerfile, start.sh, config) into ./backend
      # and fetches the GeoIP databases the image bundles.
      - name: Init repo for Dockerization
        run: docker/init.sh "$SHORT_SHA"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-contexts: |
            backend=./backend
            rustgbt=./rust
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          build-args: commitHash=${{ env.SHORT_SHA }}
          # The rust-gbt + npm build is slow; reuse layers across runs.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/mempool-backend:sha-${{ env.SHORT_SHA }}
            ghcr.io/${{ github.repository_owner }}/mempool-backend:latest
